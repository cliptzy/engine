name: Build and Release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   target: apk
          #   artifact_name: cliptzy-android
          #   file_extension: apk
          - os: ubuntu-latest
            target: linux
            artifact_name: cliptzy-linux
            file_extension: zip
          - os: windows-latest
            target: windows
            artifact_name: cliptzy-windows
            file_extension: zip
          - os: macos-latest
            target: macos
            artifact_name: cliptzy-macos
            file_extension: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get dotenv
        shell: bash
        run: echo "${{ secrets.DOTENV }}" | base64 --decode > .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libxcb-cursor0 libasound2t64 libgtk-3-dev libblkid-dev liblzma-dev libmpv-dev

      - name: Clean OS-Specific Requirements
        if: runner.os != 'macOS'
        shell: bash
        run: |
          # Menghapus 'pyobjc' dari requirements.txt agar tidak gagal saat diinstall di Linux/Windows
          grep -vi "pyobjc" requirements.txt > req_temp.txt
          mv req_temp.txt requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Build
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target}}
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Archive Executable
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "apk" ]; then
            cp build/apk/*.apk ${{ matrix.artifact_name }}.apk
          elif [ "${{ matrix.target }}" == "windows" ]; then
            cd build/windows
            7z a ../../${{ matrix.artifact_name }}.zip .
          elif [ "${{ matrix.target }}" == "macos" ]; then
            cd build/macos
            zip -ry ../../${{ matrix.artifact_name }}.zip .
          else
            cd build/linux
            zip -r ../../${{ matrix.artifact_name }}.zip .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.file_extension }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          export TAG_NAME=${GITHUB_REF#refs/tags/}
          cat << 'EOF' > generate_changelog.py
          import os
          import subprocess

          tag = os.environ.get("TAG_NAME", "")
          content = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              in_section = False
              for line in lines:
                  if line.startswith(f"## [{tag}]") or line.startswith(f"## {tag}"):
                      in_section = True
                      continue
                  elif line.startswith("## ") and in_section:
                      break
                  if in_section:
                      content += line

          if not content.strip():
              try:
                  content = subprocess.check_output(['git', 'log', '-1', '--pretty=format:%B']).decode('utf-8')
              except Exception:
                  content = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(content.strip())
          EOF
          python3 generate_changelog.py

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
