name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x run.sh || true

      - name: Package Source
        shell: bash
        run: |
          zip -r cliptzy.zip . -x "*.git*" "*.venv*" "*/__pycache__/*" "*.env" "clips/*" "logs/*" "build/*" "dist/*" ".flet/*" "cliptzy.egg-info/*" "youtube_token.json" "cookies.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliptzy
          path: cliptzy.zip

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          export TAG_NAME=${GITHUB_REF#refs/tags/}
          cat << 'EOF' > generate_changelog.py
          import os
          import subprocess

          tag = os.environ.get("TAG_NAME", "")
          content = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              in_section = False
              for line in lines:
                  if line.startswith(f"## [{tag}]") or line.startswith(f"## {tag}"):
                      in_section = True
                      continue
                  elif line.startswith("## ") and in_section:
                      break
                  if in_section:
                      content += line

          if not content.strip():
              try:
                  content = subprocess.check_output(['git', 'log', '-1', '--pretty=format:%B']).decode('utf-8')
              except Exception:
                  content = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(content.strip())
          EOF
          python3 generate_changelog.py

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
