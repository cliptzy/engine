[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cliptzy"
version = "3.0.11"
description = "Cliptzy Desktop Standalone"
readme = "README.md"
authors = [
    { name = "Dicky Mulia Fiqri", email = "santrialanwari@gmail.com" }
]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
cliptzy = "main:main"

[tool.flet.app]
module = "main.main"
name = "Cliptzy"
description = "YouTube Clipper & Auto Uploader"
exclude = [
    ".git",
    ".github",
    ".venv",
    "clips",
    "logs",
    "venv",
    "__pycache__",
    "cred",
    "*.json",
    "*.log",
    ".env",
    "*.md",
    "comments.txt",
    "tests",
    "*.sql",
    ".gitignore",
    "requirements.in"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "gui", "fonts", "assets"]
exclude = []
namespaces = false

[tool.flet.macos]
target_arch = ["x86_64"]