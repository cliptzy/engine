<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Heatmap Clipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Brutalist additions */
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap");
      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: #f4f4f0; /* Off-white */
      }
      .brutal-shadow {
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }
      .brutal-shadow-hover:hover {
        box-shadow: 6px 6px 0px 0px rgba(0, 0, 0, 1);
        transform: translate(-2px, -2px);
      }
      .brutal-shadow-hover:active {
        box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        transform: translate(2px, 2px);
      }
      .hide {
        display: none !important;
      }
      html.dark {
        filter: invert(1) hue-rotate(180deg);
        background-color: #111;
      }
      html.dark img,
      html.dark video,
      html.dark iframe {
        filter: invert(1) hue-rotate(180deg);
      }
    </style>
  </head>
  <body class="text-black overflow-x-hidden p-4 md:p-8 transition-colors duration-300">
    <!-- Top Progress -->
    <div
      id="topProgressWrap"
      class="fixed top-0 left-0 w-full h-12 bg-white border-b-4 border-black z-50 hide brutal-shadow"
      aria-hidden="true"
    >
      <div class="w-full h-full relative">
        <div
          id="topProgressBar"
          class="absolute top-0 left-0 h-full bg-pink-400 border-r-4 border-black transition-all duration-300 w-0"
        ></div>
        <div
          id="topProgressText"
          class="absolute top-0 left-0 w-full h-full flex items-center justify-center font-bold text-sm mix-blend-difference text-white"
        ></div>
      </div>
    </div>

    <main class="max-w-5xl mx-auto space-y-8 mt-8">
      <!-- Header -->
      <header
        class="flex flex-col md:flex-row justify-between items-start md:items-end border-4 border-black bg-yellow-400 p-6 brutal-shadow"
      >
        <div>
          <h1 class="text-3xl md:text-5xl font-bold uppercase tracking-tighter">YouTube<br />Heatmap Clipper</h1>
          <p class="font-bold mt-2 text-sm md:text-base border-t-2 border-black pt-2" data-i18n="top.tagline">
            Scan Most Replayed, potong otomatis, subtitle rapi.
          </p>
        </div>
        <div class="mt-4 md:mt-0 flex gap-4">
          <button id="themeToggle" class="border-4 border-black bg-white px-3 py-1 font-bold brutal-shadow-hover text-xl" title="Toggle Dark Mode">
            ◑
          </button>
          <div class="flex border-4 border-black bg-white">
            <button id="langId" class="px-3 py-1 font-bold border-r-4 border-black bg-cyan-300 hover:bg-cyan-400">
              ID
            </button>
            <button id="langEn" class="px-3 py-1 font-bold hover:bg-cyan-400">EN</button>
          </div>
        </div>
      </header>

      <!-- Main Config Card -->
      <section class="border-4 border-black bg-white p-6 brutal-shadow space-y-6">
        <!-- Preview -->
        <div
          id="preview"
          class="hide flex flex-col md:flex-row gap-4 border-4 border-black bg-blue-100 p-4 brutal-shadow"
        >
          <img id="thumbImg" alt="Thumbnail" class="w-full md:w-48 h-auto border-4 border-black object-cover" />
          <div class="flex flex-col justify-center">
            <h2 id="pvTitle" class="text-xl font-bold line-clamp-2"></h2>
            <p id="pvSub" class="text-sm font-bold mt-2 opacity-80"></p>
          </div>
        </div>
        <form id="mainForm" class="flex flex-col gap-6" onsubmit="event.preventDefault()">
        <div>
          <label class="block font-bold text-lg mb-2 uppercase" data-i18n="label.url">YouTube URL</label>
          <div class="flex gap-2">
            <input
              id="url"
              type="text"
              data-i18n-placeholder="ph.url"
              class="flex-1 border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
            />
            <button id="cekUrlBtn" type="button" class="bg-yellow-400 border-4 border-black px-6 font-bold brutal-shadow-hover uppercase">Cek</button>
          </div>
          <p class="text-sm font-bold mt-2 opacity-80" data-i18n="help.url">Paste link video/shorts.</p>
        </div>

        <!-- Cookies -->
        <div>
          <label class="block font-bold mb-2 uppercase">Import Cookies (Optional)</label>
          <div class="flex gap-2">
            <input
              type="file"
              id="cookies_file"
              accept=".txt"
              class="flex-1 border-4 border-black bg-white p-2 file:mr-4 file:py-1 file:px-2 file:border-0 file:text-sm file:font-bold file:bg-pink-400 file:border-2 file:border-black file:shadow-[2px_2px_0_0_#000] cursor-pointer text-sm"
            />
            <button
              id="uploadCookiesBtn"
              class="bg-cyan-300 border-4 border-black px-4 font-bold brutal-shadow-hover uppercase text-sm"
            >
              Upload
            </button>
          </div>
          <div class="flex items-center gap-4 mt-1">
             <p id="cookieStatusText" class="text-xs font-bold text-red-600">No cookies loaded.</p>
             <p id="cookieStatus" class="text-xs font-bold text-green-600 hide">Cookies uploaded!</p>
          </div>
        </div>

        <!-- Intro/Outro -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block font-bold mb-2 uppercase">Intro Video (Optional)</label>
            <div class="flex gap-2">
              <input
                type="file"
                id="intro_file"
                accept="video/*"
                class="flex-1 border-4 border-black bg-white p-2 file:mr-4 file:py-1 file:px-2 file:border-0 file:text-sm file:font-bold file:bg-pink-400 file:border-2 file:border-black file:shadow-[2px_2px_0_0_#000] cursor-pointer text-sm"
              />
              <button
                id="uploadIntroBtn"
                class="bg-cyan-300 border-4 border-black px-4 font-bold brutal-shadow-hover uppercase text-sm"
              >
                Upload
              </button>
            </div>
            <p id="introStatusText" class="text-xs font-bold text-red-600 mt-1">No intro loaded.</p>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase">Outro Video (Optional)</label>
            <div class="flex gap-2">
              <input
                type="file"
                id="outro_file"
                accept="video/*"
                class="flex-1 border-4 border-black bg-white p-2 file:mr-4 file:py-1 file:px-2 file:border-0 file:text-sm file:font-bold file:bg-pink-400 file:border-2 file:border-black file:shadow-[2px_2px_0_0_#000] cursor-pointer text-sm"
              />
              <button
                id="uploadOutroBtn"
                class="bg-cyan-300 border-4 border-black px-4 font-bold brutal-shadow-hover uppercase text-sm"
              >
                Upload
              </button>
            </div>
            <p id="outroStatusText" class="text-xs font-bold text-red-600 mt-1">No outro loaded.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.mode">Mode</label>
            <select
              id="mode"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="heatmap" data-i18n="opt.mode.heatmap">Scan heatmap (Most Replayed)</option>
              <option value="custom" data-i18n="opt.mode.custom">Custom start/end (manual)</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.ratio">Ratio</label>
            <select
              id="ratio"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="9:16" selected data-i18n="opt.ratio.9_16">9:16 (Shorts)</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="original" data-i18n="opt.ratio.original">Original</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.crop">Crop</label>
            <select
              id="crop"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="default" selected data-i18n="opt.crop.default">Default</option>
              <option value="split_left" data-i18n="opt.crop.split_left">Split Left</option>
              <option value="split_right" data-i18n="opt.crop.split_right">Split Right</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.padding">Padding (sec)</label>
            <input
              id="padding"
              type="number"
              min="0"
              value="10"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
            />
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.max_clips">Max clips</label>
            <input
              id="max_clips"
              type="number"
              min="1"
              value="6"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.subtitle">Subtitle</label>
            <select
              id="subtitle"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="n" selected data-i18n="opt.no">No</option>
              <option value="y" data-i18n="opt.yes">Yes</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.whisper_model">Whisper Model</label>
            <select
              id="whisper_model"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="tiny">tiny</option>
              <option value="base">base</option>
              <option value="small" selected>small</option>
              <option value="medium">medium</option>
              <option value="large-v3">large-v3</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.subtitle_font">Subtitle Font</label>
            <select
              id="subtitle_font_select"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="Plus Jakarta Sans" selected>Plus Jakarta Sans</option>
              <option value="Montserrat">Montserrat</option>
              <option value="Roboto">Roboto</option>
              <option value="Arial">Arial</option>
              <option value="custom" data-i18n="opt.custom">Custom…</option>
            </select>
            <input
              id="subtitle_font_custom"
              type="text"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow mt-2 hide"
              placeholder="e.g. Poppins"
            />
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase">Subtitle Delay (ms)</label>
            <input
              id="subtitle_delay"
              type="number"
              step="10"
              value="0"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.subtitle_location">Subtitle Location</label>
            <select
              id="subtitle_location"
              class="w-full border-4 border-black p-3 font-bold appearance-none bg-white brutal-shadow focus:outline-none cursor-pointer"
            >
              <option value="bottom" selected data-i18n="opt.subtitle_location.bottom">Bottom</option>
              <option value="center" data-i18n="opt.subtitle_location.center">Centered</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.subtitle_fontsdir">Fonts dir</label>
            <input
              id="subtitle_fontsdir"
              type="text"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
              value="fonts"
            />
          </div>
        </div>

        <div id="customBox" class="grid grid-cols-1 md:grid-cols-2 gap-6 hide">
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.start">Start (sec or mm:ss)</label>
            <input
              id="start"
              type="text"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
              placeholder="e.g. 11:29"
            />
          </div>
          <div>
            <label class="block font-bold mb-2 uppercase" data-i18n="label.end">End (sec or mm:ss)</label>
            <input
              id="end"
              type="text"
              class="w-full border-4 border-black p-3 font-bold focus:outline-none brutal-shadow"
              placeholder="e.g. 12:22"
            />
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 pt-4 border-t-4 border-black">
          <button
            id="scanBtn"
            class="flex-1 bg-pink-400 border-4 border-black p-4 font-bold text-xl uppercase brutal-shadow-hover transition-transform"
            data-i18n="btn.scan"
          >
            Scan Heatmap
          </button>
          <button
            id="clipBtn"
            class="flex-1 bg-cyan-300 border-4 border-black p-4 font-bold text-xl uppercase brutal-shadow-hover transition-transform"
            data-i18n="btn.clip"
          >
            Create Clip
          </button>
        </div>
        </form>
      </section>

      <!-- Segments Panel -->
      <section class="border-4 border-black bg-white brutal-shadow">
        <div class="flex justify-between items-center bg-yellow-400 border-b-4 border-black p-4">
          <h2 class="font-bold text-2xl uppercase" data-i18n="panel.segments">Segments</h2>
          <div class="flex items-center gap-4">
            <span id="segSelectedMeta" class="font-bold text-sm"></span>
            <span id="segMeta" class="font-bold text-sm"></span>
            <div id="segControls" class="hide flex gap-2">
              <button
                id="segSelectAllBtn"
                class="bg-white border-2 border-black font-bold px-3 py-1 text-sm brutal-shadow-hover"
                data-i18n="btn.select_all"
              >
                All
              </button>
              <button
                id="segClearBtn"
                class="bg-white border-2 border-black font-bold px-3 py-1 text-sm brutal-shadow-hover"
                data-i18n="btn.clear"
              >
                Clear
              </button>
              <button
                id="segCreateBtn"
                class="bg-cyan-300 border-2 border-black font-bold px-3 py-1 text-sm brutal-shadow-hover"
                data-i18n="btn.create_selected"
              >
                Create
              </button>
            </div>
          </div>
        </div>
        <div id="segments" class="p-4 space-y-4 max-h-96 overflow-y-auto"></div>
      </section>

      <!-- Progress Panel -->
      <section class="border-4 border-black bg-white brutal-shadow">
        <div
          class="flex justify-between items-center bg-pink-400 border-b-4 border-black p-4 text-white mix-blend-difference"
        >
          <h2 class="font-bold text-2xl uppercase mix-blend-exclusion text-white" data-i18n="panel.progress">
            Progress
          </h2>
          <div class="flex items-center gap-4 mix-blend-exclusion text-white">
             <button id="clearLogsBtn" class="border-2 border-white px-2 py-1 text-xs font-bold hover:bg-white hover:text-black transition-colors uppercase">Clear Logs</button>
             <span id="jobMeta" class="font-bold text-sm"></span>
          </div>
        </div>
        <div id="progress" class="p-4 border-b-4 border-black min-h-[4rem]"></div>
        <div
          id="consoleLog"
          class="p-4 bg-black text-green-400 font-mono text-xs md:text-sm max-h-64 overflow-y-auto whitespace-pre-wrap hide border-b-4 border-black brutal-shadow"
        ></div>
        <div id="outputs" class="p-4 bg-gray-100 flex flex-col gap-4"></div>
      </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hide flex justify-center items-center p-4">
      <div id="modalBackdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm cursor-pointer"></div>
      <div class="relative bg-white border-4 border-black brutal-shadow max-w-4xl w-full max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b-4 border-black bg-yellow-400 p-4">
          <h3 id="modalTitle" class="font-bold text-xl uppercase"></h3>
          <button id="modalClose" class="font-bold text-2xl leading-none hover:text-red-500">✕</button>
        </div>
        <div id="modalBody" class="p-4 flex-1 overflow-auto flex justify-center"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
